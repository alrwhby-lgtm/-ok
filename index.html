<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة المعرض - تسديد الأقساط المحصّن</title>
    <!-- مكتبة توليد الباركود محلياً -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        /* شاشة تسجيل الدخول */
        .login-card {
            background: #fff;
            max-width: 400px;
            margin: 60px auto;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .login-stamp {
            position: absolute;
            top: -25px;
            left: 30px;
            width: 80px;
            height: 80px;
            border: 2px dashed #0b3636;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #0b3636;
            transform: rotate(-12deg);
            font-weight: bold;
            font-size: 10px;
            background-color: rgba(11, 54, 54, 0.03);
            pointer-events: none;
        }

        .login-stamp span {
            font-size: 8px;
            border-top: 1px solid #0b3636;
            margin-top: 2px;
            padding-top: 2px;
            width: 80%;
        }

        /* استمارة تسديد الأقساط */
        .receipt-container {
            display: none;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        h2 {
            text-align: center;
            color: #0b3636;
            margin-bottom: 25px;
            font-size: 24px;
            border-bottom: 2px solid #0b3636;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: #0b3636;
            box-shadow: 0 0 0 3px rgba(11, 54, 54, 0.1);
        }

        input[readonly] {
            background-color: #e9ecef;
            color: #495057;
            cursor: not-allowed;
            font-weight: bold;
        }

        .amount-container {
            display: flex;
            gap: 10px;
        }

        .amount-container input {
            flex: 2;
        }

        .amount-container select {
            flex: 1;
        }

        .footer-verification {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            border-top: 1px dashed #ddd;
            padding-top: 20px;
        }

        /* الختم الاحترافي المزخرف بالكامل وبدون كلمة معتمد رسمي */
        .secure-stamp {
            width: 185px;
            height: 185px;
            border: 4px double #842029;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #842029;
            transform: rotate(-8deg);
            font-weight: bold;
            padding: 10px;
            box-sizing: border-box;
            background-color: rgba(132, 32, 41, 0.03);
            box-shadow: inset 0 0 0 2px rgba(132, 32, 41, 0.15), 0 0 0 2px rgba(132, 32, 41, 0.05);
            position: relative;
        }

        /* زخارف احترافية دقيقة تحاكي الأختام السيادية */
        .secure-stamp::before {
            content: "✦ ─── ❖ ─── ✦";
            font-size: 8px;
            letter-spacing: 1px;
            color: #842029;
            margin-bottom: 2px;
        }

        .secure-stamp::after {
            content: "★ ❖ ٭ ❖ ★";
            font-size: 8px;
            letter-spacing: 2px;
            color: #842029;
            margin-top: 2px;
        }

        .secure-stamp .stamp-header {
            font-size: 13px;
            border-bottom: 1.5px solid #842029;
            border-top: 1.5px solid #842029;
            padding: 3px 0;
            margin: 2px 0;
            width: 90%;
            letter-spacing: 0.5px;
        }

        .secure-stamp .stamp-body {
            font-size: 11px;
            margin: 3px 0;
            font-weight: bold;
        }

        .secure-stamp .stamp-security-code {
            font-size: 9px;
            font-family: monospace;
            background: #842029;
            color: #fff;
            padding: 1px 8px;
            border-radius: 4px;
            margin-top: 3px;
            letter-spacing: 1px;
        }

        .qr-box-container {
            text-align: center;
            background: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-label {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
            font-weight: bold;
        }

        .btn-container {
            text-align: center;
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            background-color: #0b3636;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        .action-btn:hover {
            background-color: #145555;
        }

        .logout-btn {
            background-color: #d9534f;
        }
        .logout-btn:hover {
            background-color: #c9302c;
        }

        #loginError {
            color: #d9534f;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }
            .login-card, .btn-container {
                display: none !important;
            }
            .receipt-container {
                display: block !important;
                box-shadow: none;
                padding: 0;
                width: 100%;
                max-width: 100%;
            }
            input, select {
                border: none;
                border-bottom: 1px solid #000;
                border-radius: 0;
                padding: 5px 0;
                background: transparent;
            }
            input[readonly] {
                background: transparent;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginSection" class="login-card">
        <div class="login-stamp">
            نظام آمن
            <span>مشفّر</span>
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="border:none; margin:0; font-size:20px;">تسجيل الدخول</h2>
            <p style="color: #666; font-size: 13px; margin-top: 5px;">أدخل اسم المستخدم والرقم السري</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="username">اسم المستخدم:</label>
                <input type="text" id="username" placeholder="وهبي أو ووميض" required>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label for="password">الرقم السري:</label>
                <input type="password" id="password" placeholder="أدخل الرقم السري" required>
            </div>

            <div id="loginError">اسم المستخدم أو الرقم السري غير صحيح!</div>

            <button type="submit" class="action-btn" style="width: 100%; margin-top: 10px;">دخول إلى النظام</button>
        </form>
    </div>

    <!-- 2. استمارة تسديد الأقساط -->
    <div id="receiptSection" class="receipt-container">
        <h2>استمارة تسديد قسط شهري محصّنة</h2>

        <div class="form-grid">
            <div class="form-group">
                <label for="installmentNum">رقم القسط:</label>
                <select id="installmentNum" onchange="generateSecureQR()">
                    <option value="" disabled selected>اختر رقم القسط</option>
                    <script>
                        for(let i = 1; i <= 100; i++) {
                            document.write(`<option value="${i}">القسط رقم ${i}</option>`);
                        }
                    </script>
                </select>
            </div>

            <div class="form-group">
                <label for="receiptDate">تاريخ الاستلام:</label>
                <input type="date" id="receiptDate" onchange="generateSecureQR()">
            </div>

            <div class="form-group full-width">
                <label for="amount">مبلغ القسط:</label>
                <div class="amount-container">
                    <input type="number" id="amount" placeholder="أدخل المبلغ المستلم" oninput="generateSecureQR()">
                    <select id="currency" onchange="generateSecureQR()">
                        <option value="دولار">دولار أمريكي ($)</option>
                        <option value="عراقي">دينار عراقي (IQD)</option>
                    </select>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="receiverName">مستلم المبلغ (الموظف المسؤول):</label>
                <input type="text" id="receiverName" readonly>
            </div>
        </div>

        <div class="footer-verification">
            <!-- الختم المزخرف الاحترافي الجديد (بدون عبارة معتمد رسمي) -->
            <div class="secure-stamp">
                <div class="stamp-header">تم الاستلام رسمياً</div>
                <div class="stamp-body" id="stampUserDisplay">المستلم: ---</div>
                <div class="stamp-security-code">SEC-ID: #8839-IQ</div>
            </div>

            <!-- باركود محلي مشفر بقيم العملية والمبلغ -->
            <div class="qr-box-container">
                <div id="qrcode"></div>
                <div class="qr-label">باركود التحقق المالي المحلي</div>
            </div>
        </div>

        <div class="btn-container">
            <button class="action-btn" onclick="window.print()">طباعة / حفظ PDF</button>
            <button class="action-btn logout-btn" onclick="handleLogout()">تسجيل الخروج</button>
        </div>
    </div>
</div>

<script>
    const users = {
        "وهبي": "0000",
        "وميض": "1111"
    };

    function handleLogin(event) {
        event.preventDefault();
        
        const userInput = document.getElementById('username').value.trim();
        const passInput = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('loginError');

        if (users[userInput] && users[userInput] === passInput) {
            errorMsg.style.display = 'none';
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('receiptSection').style.display = 'block';
            
            document.getElementById('receiverName').value = userInput;
            document.getElementById('stampUserDisplay').innerText = `المستلم: ${userInput}`;
            
            generateSecureQR();
        } else {
            errorMsg.style.display = 'block';
        }
    }

    function handleLogout() {
        document.getElementById('receiptSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('loginError').style.display = 'none';
    }

    function generateSecureQR() {
        const qrcodeContainer = document.getElementById("qrcode");
        qrcodeContainer.innerHTML = "";

        const instNum = document.getElementById('installmentNum').value || "غير محدد";
        const amount = document.getElementById('amount').value || "0";
        const currency = document.getElementById('currency').value;
        const receiver = document.getElementById('receiverName').value;
        const date = document.getElementById('receiptDate').value || "تاريخ غير محدد";

        const qrData = `قسط:${instNum}|المبلغ:${amount} ${currency}|المستلم:${receiver}|التاريخ:${date}|الحالة:مؤكد`;

        new QRCode(qrcodeContainer, {
            text: qrData,
            width: 85,
            height: 85,
            colorDark: "#0b3636",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
    }
</script>

</body>
</html>
